<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Egresos - Dashboard Financiero</title>
    <link rel="stylesheet" href="egresos.css">
    <!-- Fonts and Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="contenedor-dashboard">
        <!-- Encabezado -->
        <header class="encabezado-dashboard">
            <a href="../panel_movimientos/movimientos.html" class="btn-regresar" id="btnRegresar">
                <i class="fas fa-arrow-left"></i> Regresar
            </a>
            <div class="selector-mes">
                <button class="flecha-nav" id="mesPrevio"><i class="fas fa-chevron-left"></i></button>
                <span class="mes-actual" id="nombreMes">ABRIL 2026</span>
                <button class="flecha-nav" id="mesSiguiente"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div style="width: 100px;"></div> <!-- Spacer for centering -->
        </header>

        <!-- Resumen Superior -->
        <section class="resumen-superior">
            <div class="tarjeta-resumen">
                <h3>Gastos</h3>
                <div class="monto" id="resumenEgresos" style="color: var(--danger); text-shadow: 0 0 15px rgba(255, 77, 77, 0.3);">$ 0</div>
            </div>
            <div class="tarjeta-resumen">
                <h3>Saldo Total</h3>
                <div class="monto" id="resumenSaldo" style="color: var(--growth-green);">$ 0</div>
            </div>
        </section>

        <!-- Gestión de Egresos -->
        <section class="seccion-tabla">
            <h2>Gestión de Egresos - Detalle</h2>
            <div class="contenedor-tabla">
                <table id="tablaEgresos">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Descripción</th>
                            <th>Método</th>
                            <th>Concepto</th>
                            <th>Monto</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla">
                        <!-- Filas insertadas dinámicamente -->
                    </tbody>
                </table>
            </div>
            <div class="paginacion-contenedor" style="display: flex; justify-content: center; align-items: center; gap: 1rem; margin-top: 1rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 1rem;">
                <button id="btnPrevPag" class="btn-regresar" style="padding: 0.3rem 0.8rem;"><i class="fas fa-chevron-left"></i></button>
                <span id="infoPaginacion" style="color: var(--gold-light); font-size: 0.9rem;">1 / 1</span>
                <button id="btnNextPag" class="btn-regresar" style="padding: 0.3rem 0.8rem;"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="pie-tabla" style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1rem;">
                <button class="btn-agregar" id="btnAgregar">
                    <i class="fas fa-plus"></i> AGREGAR
                </button>
                <button class="btn-agregar" id="btnGuardar" style="background: linear-gradient(135deg, var(--gold-light), var(--matte-gold));">
                    <i class="fas fa-save"></i> GUARDAR
                </button>
            </div>
        </section>

        <!-- Sección de Análisis -->
        <section class="seccion-analisis">
            <div style="width: 100%; margin-bottom: 0.5rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem;">
                <h2 style="color: var(--gold-light); font-size: 1.1rem; text-transform: uppercase;">Análisis de Evolución y Distribución</h2>
            </div>
            
            <div class="contenedor-analisis-grid">
                <!-- Tarjeta Izquierda -->
                <div class="tarjeta-analisis tarjeta-izq">
                    <!-- Barras -->
                    <div class="contenedor-grafico-barras">
                        <h3 style="font-size: 0.75rem; text-transform: uppercase; color: var(--gold-light); margin-bottom: 1rem; text-align: center;">Evolución de Egresos</h3>
                        <canvas id="graficoBarras"></canvas>
                    </div>
                    <!-- Resumen Inferior -->
                    <div class="resumen-inferior" style="width: 90%; margin: 1.5rem auto 0 auto; border-top: 1px solid var(--glass-border); padding-top: 1rem; display: flex; justify-content: center; align-items: center; gap: 0.8rem;">
                        <span style="color: var(--text-muted); font-size: 0.70rem; text-transform: uppercase;">Total de Egresos:</span>
                        <span id="analisisEgresos" style="color: var(--danger); font-size: 1.15rem; font-weight: bold; text-shadow: 0 0 10px rgba(255, 77, 77, 0.5);">$ 0</span>
                    </div>
                </div>

                <!-- Tarjeta Derecha -->
                <div class="tarjeta-analisis tarjeta-der">
                    <h3 style="font-size: 0.75rem; text-transform: uppercase; color: var(--gold-light); margin-bottom: 1rem; text-align: center;">Distribución de Fuentes</h3>
                    <div class="contenedor-grafico-circular">
                        <canvas id="graficoCircular"></canvas>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="Egresos.js"></script>
</body>
</html>
