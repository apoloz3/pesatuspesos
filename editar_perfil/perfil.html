<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Pesa tus pesos</title>
    <link rel="stylesheet" href="../pagina_maestra/estilo.css">
    <link rel="stylesheet" href="perfil.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="contenedor-perfil-app">
        <header class="cabecera-perfil">
            <h1>Configuración de Perfil</h1>
        </header>

        <main class="rejilla-principal-perfil">
            <!-- Sección Izquierda: Foto de Perfil -->
            <section class="tarjeta-perfil seccion-foto-perfil">
                <h2 class="titulo-tarjeta">Foto de Perfil</h2>
                <div class="vista-avatar">
                    <img id="vista-previa-foto" src="img/hucha.png" alt="Avatar Usuario">
                </div>
                <div class="acciones-avatar">
                    <button id="btn-cambiar-foto" class="boton boton-principal">Cambiar Foto</button>
                    <button id="btn-eliminar-foto" class="boton boton-peligro">Eliminar Foto</button>
                </div>
                <!-- Entrada oculta para subir archivos -->
                <input type="file" id="entrada-foto" style="display: none;" accept="image/*">
            </section>

            <!-- Sección Derecha: Información Personal -->
            <section class="tarjeta-perfil seccion-info-personal">
                <h2 class="titulo-tarjeta">Información Personal</h2>
                <form id="formulario-info-personal" class="formulario-vertical">
                    <div class="grupo-formulario">
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" name="nombre" value="Carlos Gómez" required>
                    </div>
                    <div class="grupo-formulario">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" value="carlos.gomez@email.com" required>
                    </div>
                    <div class="grupo-formulario">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" value="+34 600 123 456">
                    </div>
                    <button type="submit" class="boton boton-principal boton-guardar">Guardar Cambios</button>
                </form>
            </section>

            <!-- Sección Inferior: Cambiar Contraseña -->
            <section class="tarjeta-perfil seccion-contrasena">
                <h2 class="titulo-tarjeta">Cambiar Contraseña</h2>
                <form id="formulario-contrasena" class="formulario-vertical">
                    <div class="fila-formulario">
                        <div class="grupo-formulario contenedor-contrasena">
                            <label for="pass-actual">Contraseña Actual</label>
                            <div class="input-con-icono">
                                <input type="password" id="pass-actual" name="pass-actual" placeholder="••••••••">
                                <button type="button" class="btn-alternar-contrasena" data-objetivo="pass-actual">
                                    <img src="https://api.iconify.design/lucide:eye.svg" alt="Mostrar">
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="fila-formulario">
                        <div class="grupo-formulario contenedor-contrasena">
                            <label for="pass-nueva">Nueva Contraseña</label>
                            <div class="input-con-icono">
                                <input type="password" id="pass-nueva" name="pass-nueva" placeholder="••••••••">
                                <button type="button" class="btn-alternar-contrasena" data-objetivo="pass-nueva">
                                    <img src="https://api.iconify.design/lucide:eye.svg" alt="Mostrar">
                                </button>
                            </div>
                        </div>
                        <div class="grupo-formulario contenedor-contrasena">
                            <label for="pass-confirmar">Confirmar Nueva Contraseña</label>
                            <div class="input-con-icono">
                                <input type="password" id="pass-confirmar" name="pass-confirmar" placeholder="••••••••">
                                <button type="button" class="btn-alternar-contrasena" data-objetivo="pass-confirmar">
                                    <img src="https://api.iconify.design/lucide:eye.svg" alt="Mostrar">
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="contenedor-boton-centrado">
                        <button type="submit" class="boton boton-principal">Actualizar Contraseña</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script src="perfil.js"></script>
</body>
</html>
