<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Perfil - Pesa tus Pesos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="../pagina_maestra/estilo.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="perfil.css">
</head>
<body>
    <div class="contenedor-principal">
        <header class="cabecera">
            <div class="izquierda">
                <button class="boton-volver" id="boton-volver">
                    <i class="ph ph-arrow-left"></i> Volver
                </button>
                <h1 class="titulo-pagina" id="titulo-estado">Configuración de Perfil</h1>
            </div>
        </header>

        <main class="contenido-perfil">
            <!-- PANEL 1: INFORMACIÓN PERSONAL -->
            <div class="tarjeta-perfil" id="panel-informacion">
                <div class="seccion-avatar">
                    <div class="contenedor-foto">
                        <img src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=1000&auto=format&fit=crop" alt="Foto de Perfil" id="foto-perfil">
                        <!-- Input oculto para subir archivo -->
                        <input type="file" id="input-foto" accept="image/*" style="display: none;">
                    </div>
                    <div class="acciones-foto-exterior">
                        <button class="boton-editar-foto-v2" id="btn-cambiar-foto">
                            <i class="ph ph-camera"></i> Editar Foto
                        </button>
                        <button class="boton-eliminar-foto-v2" id="btn-eliminar-foto">
                            <i class="ph ph-trash"></i> Eliminar Foto
                        </button>
                        <button class="boton-seguridad" id="ir-a-seguridad">
                            <i class="ph ph-lock"></i> Cambiar Contraseña
                        </button>
                    </div>
                </div>

                <div class="seccion-formulario">
                    <div class="contenedor-campos">
                        <div class="campo-grupo">
                            <label for="nombre">Nombre Completo</label>
                            <div class="input-linea">
                                <input type="text" id="nombre" value="María García"> <!-- Sin placeholder -->
                                <i class="ph ph-user"></i>
                            </div>
                        </div>

                        <div class="campo-grupo">
                            <label for="email">Correo Electrónico</label>
                            <div class="input-linea">
                                <input type="email" id="email" value="maria.garcia@email.co"> <!-- Sin placeholder -->
                                <i class="ph ph-envelope"></i>
                            </div>
                        </div>

                        <div class="campo-grupo">
                            <label for="telefono">Teléfono</label>
                            <div class="input-linea">
                                <input type="tel" id="telefono" value="+57 312 456 7890"> <!-- Sin placeholder -->
                                <i class="ph ph-phone"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Botones dentro de la tarjeta -->
                    <div class="acciones-dentro-tarjeta">
                        <button class="boton-guardar btn-guardar-global">Guardar Cambios</button>
                        <button class="boton-cancelar btn-cancelar-global">Cancelar</button>
                    </div>
                </div>
            </div>

            <!-- PANEL 2: CAMBIO DE CONTRASEÑA -->
            <div class="tarjeta-perfil oculto" id="panel-seguridad">
                <div class="seccion-formulario-completo">
                    <div class="encabezado-panel">
                        <button class="boton-regresar-perfil" id="regresar-a-informacion">
                            <i class="ph ph-caret-left"></i> Regresar a información
                        </button>
                        <h2>Cambiar Contraseña</h2>
                        <p>Verifica tu identidad para establecer una nueva clave.</p>
                    </div>

                    <div class="campo-grupo">
                        <label for="pass-actual">Contraseña Actual</label>
                        <div class="input-linea">
                            <input type="password" id="pass-actual"> <!-- Sin placeholder -->
                            <button class="toggle-password" type="button">
                                <i class="ph ph-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="campo-grupo">
                        <label for="pass-nueva">Nueva Contraseña</label> <!-- Texto mejorado -->
                        <div class="input-linea">
                            <input type="password" id="pass-nueva"> <!-- Sin placeholder -->
                            <button class="toggle-password" type="button">
                                <i class="ph ph-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="campo-grupo">
                        <label for="pass-confirm">Confirmar Contraseña</label> <!-- Texto mejorado -->
                        <div class="input-linea">
                            <input type="password" id="pass-confirm"> <!-- Sin placeholder -->
                            <button class="toggle-password" type="button">
                                <i class="ph ph-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Botones dentro de la tarjeta de seguridad -->
                    <div class="acciones-dentro-tarjeta mt-auto">
                        <button class="boton-guardar btn-guardar-global">Guardar Cambios</button>
                        <button class="boton-cancelar btn-cancelar-global">Cancelar</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast" id="toast"></div>

    <div class="modal-cancelar" id="modal-cancelar">
      <div class="modal-cancelar__contenido">
        <h3>¿Salir sin guardar?</h3>
        <p>Los cambios que hiciste no se guardarán.</p>
        <div class="modal-cancelar__acciones">
          <button class="modal-btn-salir" id="modal-confirmar-salir">Sí, salir</button>
          <button class="modal-btn-quedarse" id="modal-quedarse">Quedarme</button>
        </div>
      </div>
    </div>

    <script src="perfil.js"></script>
</body>
</html>
