<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuarios | Panel de Administración</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style_admin.css" />
  </head>
  <body>
    <div class="contenedor-app">
      <!-- Barra Lateral -->
      <aside class="barra-lateral">
        <div class="logo-barra-lateral">
          <i class="fa-solid fa-scale-balanced" style="color: #1c84ee; margin-right: 12px"></i>
          PesaTusPesos
        </div>
        <nav class="navegacion-barra-lateral">
          <a href="resumen.html" class="item-navegacion" data-target="resumen">
            <i class="fa-solid fa-house"></i> Resumen
          </a>
          <a href="usuarios.html" class="item-navegacion" data-target="usuarios">
            <i class="fa-solid fa-users"></i> Usuarios
          </a>
          <a href="roles.html" class="item-navegacion" data-target="roles">
            <i class="fa-solid fa-key"></i> Roles y Permisos
          </a>
          <a href="configuracion.html" class="item-navegacion" data-target="configuracion">
            <i class="fa-solid fa-gear"></i> Configuración
          </a>
          <a href="reportes.html" class="item-navegacion" data-target="reportes">
            <i class="fa-solid fa-chart-simple"></i> Reportes
          </a>
        </nav>
        <div class="pie-barra-lateral">
          <a href="#" class="item-navegacion texto-peligro" id="boton-cerrar-sesion">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar Sesión
          </a>
        </div>
      </aside>

      <!-- Contenido Principal -->
      <main class="contenido-principal">
        <header class="barra-superior">
          <div class="header-izquierda">
            <button id="boton-menu-movil" class="boton-menu-movil">
              <i class="fa-solid fa-bars"></i>
            </button>
            <h1 id="titulo-pagina">
              Panel de Administración - <span class="texto-primario">Gestión de Usuarios</span>
            </h1>
          </div>
          <div class="barra-superior-derecha">
            <i class="fa-solid fa-gear icono-barra-superior"></i>
            <div class="perfil-usuario">
              <img src="https://ui-avatars.com/api/?name=Admin&background=1c84ee&color=fff" alt="Admin" class="avatar" />
              <span>Administrador <i class="fa-solid fa-chevron-down"></i></span>
            </div>
          </div>
        </header>

        <div class="area-contenido">
          <section id="seccion-usuarios" class="seccion-pagina activo">
            <div class="panel">
              <h3>Usuarios Registrados</h3>
              <div class="barra-herramientas">
                <div class="caja-busqueda">
                  <i class="fa-solid fa-magnifying-glass"></i>
                  <input type="text" id="buscar-usuario" placeholder="Buscar por nombre, correo o ID..." />
                </div>
                <div class="caja-filtro">
                  <label>Estado: </label>
                  <select id="filtrar-estado">
                    <option value="Todos">Todos</option>
                    <option value="Activo">Activo</option>
                    <option value="Inactivo">Inactivo</option>
                  </select>
                </div>
                <button class="boton boton-primario" id="boton-agregar-usuario">
                  <i class="fa-solid fa-plus"></i> Añadir Nuevo Usuario
                </button>
              </div>
              <div class="contenedor-tabla">
                <table class="tabla tabla-personalizada" id="tabla-usuarios-principal">
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Nombre</th>
                      <th>Correo Electrónico</th>
                      <th>Rol</th>
                      <th>Estado</th>
                      <th>Fecha de Registro</th>
                      <th>Acciones</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
              <!-- Paginación se renderiza aquí -->
              <div id="paginacion-usuarios" class="contenedor-paginacion"></div>
            </div>
          </section>

        </div>
      </main>
    </div>

    <!-- Modales -->
    <div class="superposicion-modal" id="modal-generico">
      <div class="contenido-modal">
        <div class="encabezado-modal">
          <h3 id="titulo-modal">Añadir Nuevo Elemento</h3>
          <button class="cerrar-modal" id="cerrar-modal-btn">&times;</button>
        </div>
        <form id="formulario-generico">
          <input type="hidden" id="id-elemento" />
          <div class="grupo-formulario" id="grupo-nombre">
            <label>Nombre completo</label>
            <input type="text" id="nombre-elemento" class="control-formulario" required />
          </div>
          <div class="grupo-formulario" id="grupo-email">
            <label>Correo Electrónico</label>
            <input type="email" id="email-elemento" class="control-formulario" />
          </div>
          <div class="grupo-formulario" id="grupo-rol">
            <label>Rol asignado</label>
            <select id="rol-elemento" class="control-formulario">
            </select>
          </div>
          <div class="grupo-formulario grupo-checkbox" id="grupo-activo">
            <input type="checkbox" id="activo-elemento" checked />
            <label>¿Estado activo?</label>
          </div>
          <button type="submit" class="boton boton-primario boton-block">Guardar Cambios</button>
        </form>
      </div>
    </div>

    <div class="contenedor-notificaciones" id="contenedor-notificaciones"></div>
    <script src="admin.js"></script>
  </body>
</html>
